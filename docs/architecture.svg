<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#222">entra-mcp: one request path, two credentials, a human between proposal and execution</text>

  <!-- client -->
  <rect x="20" y="70" width="170" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="105" y="98" text-anchor="middle" font-weight="600" fill="#1f3a5f">Claude Desktop</text>
  <text x="105" y="118" text-anchor="middle" fill="#444">MCP client (stdio)</text>

  <!-- server box -->
  <rect x="230" y="55" width="560" height="430" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="5 4"/>
  <text x="245" y="78" font-weight="600" fill="#333">entra-mcp server (Python, local, no network listener)</text>

  <!-- registry -->
  <rect x="250" y="95" width="230" height="78" rx="8" fill="#fff" stroke="#666"/>
  <text x="365" y="117" text-anchor="middle" font-weight="600">Tool registry</text>
  <text x="365" y="136" text-anchor="middle" fill="#444">18 tools, pydantic strict + extra=forbid</text>
  <text x="365" y="154" text-anchor="middle" fill="#444">UPN regex + tenant domain, bounded ints</text>

  <!-- gate -->
  <rect x="250" y="195" width="230" height="110" rx="8" fill="#fff" stroke="#666"/>
  <text x="365" y="217" text-anchor="middle" font-weight="600">Policy gate</text>
  <text x="365" y="236" text-anchor="middle" fill="#444">allowlist: 21 fixed templates,</text>
  <text x="365" y="252" text-anchor="middle" fill="#444">the only URL builder; no wipe / retire / delete</text>
  <text x="365" y="272" text-anchor="middle" fill="#444">target guard: deny list, directory roles,</text>
  <text x="365" y="288" text-anchor="middle" fill="#444">role assignments, role-assignable groups</text>

  <!-- approvals -->
  <rect x="535" y="195" width="235" height="110" rx="8" fill="#fff6e5" stroke="#c77d00"/>
  <text x="652" y="217" text-anchor="middle" font-weight="600" fill="#7a4b00">Approval store</text>
  <text x="652" y="236" text-anchor="middle" fill="#444">audit/approvals.json, 0600, fcntl lock</text>
  <text x="652" y="252" text-anchor="middle" fill="#444" font-size="9.5">pending → approved → executed | failed | uncertain</text>
  <text x="652" y="268" text-anchor="middle" fill="#444">10-minute TTL, single use,</text>
  <text x="652" y="284" text-anchor="middle" fill="#444">SHA-256 digest verified at claim</text>

  <!-- read client -->
  <rect x="250" y="330" width="230" height="90" rx="8" fill="#eaf5ea" stroke="#2e7d32"/>
  <text x="365" y="352" text-anchor="middle" font-weight="600" fill="#1b5e20">Read client</text>
  <text x="365" y="371" text-anchor="middle" fill="#444">app-only token, 5 × *.Read.All</text>
  <text x="365" y="387" text-anchor="middle" fill="#444">GET only; retries 429/503/timeout</text>
  <text x="365" y="403" text-anchor="middle" fill="#444">secret from macOS Keychain</text>

  <!-- write client -->
  <rect x="520" y="330" width="250" height="90" rx="8" fill="#fdecea" stroke="#b3261e"/>
  <text x="645" y="352" text-anchor="middle" font-weight="600" fill="#8a1c14">Write client</text>
  <text x="645" y="371" text-anchor="middle" fill="#444">delegated token (ops.admin, device code)</text>
  <text x="645" y="387" text-anchor="middle" fill="#444">one template per tool, sent exactly once</text>
  <text x="645" y="403" text-anchor="middle" fill="#444">no retry; timeout → uncertain</text>

  <!-- audit -->
  <rect x="250" y="440" width="520" height="34" rx="8" fill="#fff" stroke="#666"/>
  <text x="510" y="462" text-anchor="middle" fill="#333">Audit log (JSONL, redacted): tool · action · target · actor · decision · Graph status · request id</text>

  <!-- graph -->
  <rect x="840" y="330" width="180" height="90" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="930" y="356" text-anchor="middle" font-weight="600" fill="#1f3a5f">Microsoft Graph v1.0</text>
  <text x="930" y="376" text-anchor="middle" fill="#444">Entra ID P1 · Intune</text>
  <text x="930" y="394" text-anchor="middle" fill="#444">Business Premium tenant</text>

  <!-- human -->
  <rect x="840" y="195" width="180" height="110" rx="8" fill="#fff6e5" stroke="#c77d00"/>
  <text x="930" y="220" text-anchor="middle" font-weight="600" fill="#7a4b00">Human at the keyboard</text>
  <text x="930" y="242" text-anchor="middle" fill="#444">Terminal:</text>
  <text x="930" y="260" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#333">entra-mcp approve apr_…</text>
  <text x="930" y="282" text-anchor="middle" fill="#444">the only way a proposal</text>
  <text x="930" y="298" text-anchor="middle" fill="#444">becomes approved</text>

  <!-- arrows -->
  <line x1="190" y1="105" x2="250" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="365" y1="173" x2="365" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="365" y1="305" x2="365" y2="330" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="322" fill="#2e7d32" font-size="10.5">reads + guard lookups</text>
  <line x1="480" y1="250" x2="535" y2="250" stroke="#c77d00" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="507" y="241" text-anchor="middle" fill="#7a4b00" font-size="9.5">write tool</text>
  <text x="507" y="264" text-anchor="middle" fill="#7a4b00" font-size="9.5">= proposal</text>
  <line x1="770" y1="250" x2="840" y2="250" stroke="#c77d00" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="645" y1="305" x2="645" y2="330" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="652" y="322" fill="#b3261e" font-size="10.5">approve tool, only if human-approved</text>
  <line x1="480" y1="375" x2="840" y2="375" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 3"/>
  <line x1="770" y1="395" x2="840" y2="395" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="365" y1="420" x2="365" y2="440" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="645" y1="420" x2="645" y2="440" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- legend / guarantees -->
  <text x="20" y="520" font-weight="600" fill="#222">Guarantees enforced in code, not in the prompt</text>
  <text x="20" y="542" fill="#444">• The read client cannot send a write template; the write path refuses any token without delegated scopes.</text>
  <text x="20" y="560" fill="#444">• Admin accounts (deny list, directory roles, role assignments, role-assignable groups) are never valid targets, for reads or writes.</text>
  <text x="20" y="578" fill="#444">• Rejected arguments and refused targets reach Graph zero times. Generated passwords and TAPs are returned once and never written.</text>
  <text x="20" y="596" fill="#444">• Device actions only on ids listed in config.toml. Wipe, retire and delete exist nowhere in the allowlist or the tool registry.</text>
</svg>
