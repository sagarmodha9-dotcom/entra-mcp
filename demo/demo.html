<script>
const T = JSON.parse(document.getElementById('transcript').textContent);
const steps = T.steps;
const params = new URLSearchParams(location.search);
const SPEED = parseFloat(params.get('speed') || '1');          // >1 = faster
const q = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(obj){ // syntax-highlighted JSON

function clipTo(el, count){ // walk text nodes and truncate after `count` characters

  const pill = (cls, t)=>`<span class="pill ${cls}">${q(t)}</span>`;
  if (s.phase==='validate') return pill('bad','REJECTED · invalid_arguments') + pill('ok',`${calls} Graph calls`);
  if (s.phase==='deny') return pill('bad','REFUSED · protected target') + pill('ok',`${calls} Graph calls`);
  if (s.phase==='propose') return pill('info','status: proposed') + pill('ok', `${g.filter(x=>!x.startsWith('GET')).length} writes sent`);
  if (s.phase==='boundary') return pill('bad','REFUSED · not_approved') + pill('ok', `${g.filter(x=>!x.startsWith('GET')).length} writes sent`);
  if (s.phase==='human') return pill('ok','approved_by: cli:jordan (Terminal)') + pill('info','human step');
  if (s.phase==='execute') return pill('ok','EXECUTED · Graph 200') + pill('info', g.filter(x=>!x.startsWith('GET')).join(' '));
  if (s.phase==='replay') return pill('bad','REFUSED · not_executable') + pill('ok','single use');
  if (s.phase==='read') return pill('ok','allowed') + pill('info', `${calls} Graph GETs (user + guard lookups)`);
  if (s.phase==='audit') return pill('ok','no tokens or secrets in the log');
  return '';
}
async function run(){
  for (let i=0;i<steps.length;i++){
    const s = steps[i]; const d = DUR[s.phase]||9000;
    bars.forEach((b,j)=>{ b.className = j<i?'done':(j===i?'now':''); });
    $('phase').textContent = PHASE[s.phase]||s.phase; $('title').textContent = s.title;
    $('actor').className = s.actor; $('actor').textContent = {ai:'AI · MCP client (Claude Desktop)', human:'HUMAN · Terminal', system:'SYSTEM'}[s.actor];
    $('caption').textContent = s.caption; $('foot').textContent = FOOT[s.phase]||''; $('verdict').innerHTML='';
    $('res').innerHTML=''; $('clock').textContent = `step ${i+1} / ${steps.length}`;
    await type($('req'), reqHtml(s), d*0.25);
    await sleep(d*0.1);
    await type($('res'), resHtml(s), d*0.35);
    $('verdict').innerHTML = verdict(s);
    await sleep(d*0.3);
  }
  bars.forEach(b=>b.className='done');
  document.body.dataset.done = '1';
}
run();
</script>
