# entra-mcp configuration. Copy config.example.toml to config.toml (gitignored) and fill in your tenant. No secrets here:
# the client secret lives in the macOS Keychain (see README). Tenant and client ids are not credentials, but they identify a
# real tenant, so the real file stays out of the repository.

[tenant]
tenant_id = "<your tenant id (GUID)>"
client_id = "<entra-mcp-readonly app (client) id>"
domain = "<yourtenant>.onmicrosoft.com"      # the only UPN domain the schemas accept

[keychain]
service = "entra-mcp-readonly"
account = "<your macOS user>"

[guard]
# Deny list, checked before any Graph call. Writes do not exist in milestone 1; reads against these
# accounts are refused as well, so the read server can never be used to profile the admins.
protected_upns = ["<your admin upn>", "<your operator upn>"]
cache_seconds = 60

[devices]
# Intune device ids that milestone 4's actions (sync, reboot) will be allowed to touch. Unused by the
# milestone-1 reads; present so the config shape is settled now.
test_device_ids = []

[limits]
timeout_seconds = 10        # per request; measured p50 ~1 s, max ~2.5 s for every read except the sign-in log
                            # (which has its own 20 s per-attempt budget in graph.py)
page_size = 20
max_retries = 3
tool_deadline_seconds = 40  # hard wall-clock cap per tool call, all requests + retries; then `unavailable`

[audit]
path = "audit/entra-mcp.jsonl"

[writes]
# Milestones 2-4. Second app registration (entra-mcp-writes), DELEGATED permissions only, device-code sign-in by
# the operator with `entra-mcp login`. Leave client_id empty to run the read-only server (milestone 1) alone.
client_id = "<entra-mcp-writes app (client) id; leave empty to run reads only>"
token_cache = "~/Library/Application Support/entra-mcp/msal_cache.bin"   # MSAL cache, mode 0600, outside the repo
approvals = "audit/approvals.json"                                        # proposal store, gitignored
approval_ttl_seconds = 600
